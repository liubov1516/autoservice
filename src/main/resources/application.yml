server:
  port: 8080

spring:
  application:
    name: autoservice
  datasource:
    url: jdbc:postgresql://localhost:5432/autoservice
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  quartz:
    job-store-type: jdbc              # розклад зберігається в БД і переживає перезапуск
    jdbc:
      initialize-schema: never        # таблиці QRTZ_* створює Liquibase, а не Spring Boot
    overwrite-existing-jobs: true     # при новому деплої оновлюємо збережені завдання й тригери
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: autoservice-scheduler
      org.quartz.threadPool.threadCount: 3
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.useProperties: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: autoservice-app
            client-secret: autoservice-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/autoservice
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/autoservice
