databaseChangeLog:
  - changeSet:
      id: 001-create-repair-orders
      author: student
      changes:
        - createTable:
            tableName: repair_orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: car_model
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: plate_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
